name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: build-and-deploy-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-and-deploy-to-openmrs-jfrog.yml@main
    with:
      image_name: partnersinhealth/pihliberia-emr
      maven_profiles: distro-zip
      notify_ci_dashboard: true
    secrets: inherit

  smoke-tests:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: smoke-tests-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/smoke-tests.yml
    secrets: inherit

  # legacy kouka server, until the jjd-ci instance replaces it (TASKS-556)
  deploy-to-kouka:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: deploy-to-kouka-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: kouka
      notify_ci_dashboard: true
    secrets: inherit

  deploy-to-jjd-ci:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: appclstr-01
      instances: jjd-ci
      host: false
      notify_ci_dashboard: true
    secrets: inherit
